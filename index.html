<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Turbo Amigos Kart</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}
html,body,canvas,#tc,#tc button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
canvas,#tc button{touch-action:none}
html,body{margin:0;height:100%;background:#0b0d18;color:#fff;font-family:'Trebuchet MS',system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 50% 15%,#2b3585,#0b0d18 70%);padding:12px;overflow:auto;text-align:center}
h1{margin:0;font-size:clamp(28px,6vw,54px);color:#ffcb1f;text-shadow:3px 3px 0 #e8341c;font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 18px;background:#ffcb1f;color:#222;cursor:pointer;box-shadow:0 4px 0 #b88a00}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a00}
button.alt{background:#3b82f6;color:#fff;box-shadow:0 4px 0 #1d4ea8}
.card{width:86px;padding:6px;border-radius:12px;background:#ffffff14;border:3px solid transparent;cursor:pointer;font-size:12px}
.card img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff}
.card.on{border-color:#ffcb1f;background:#ffffff30}
.trk{width:122px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:3px solid transparent;cursor:pointer;text-align:center}
.trk.on{border-color:#fff;outline:3px solid #ffcb1f}
input{font:inherit;padding:10px;border-radius:10px;border:0;width:110px;text-align:center;text-transform:uppercase}
small{opacity:.8}
#res{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#000d;padding:16px 22px;border-radius:16px;display:none;min-width:250px}
#res h2{margin:0 0 8px}.rr{display:flex;align-items:center;gap:8px;padding:3px 0;text-align:left}.rr img{width:30px;height:30px;border-radius:50%;object-fit:cover}
#tc{position:fixed;bottom:12px;left:0;right:0;display:none;justify-content:space-between;padding:0 14px;pointer-events:none}
#tc div{display:flex;gap:10px}#tc button{pointer-events:auto;width:78px;height:78px;font-size:30px;border-radius:50%;padding:0;opacity:.8}
#burn-overlay{position:fixed;inset:0;pointer-events:none;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle, rgba(255,50,0,0.6) 0%, rgba(200,0,0,0.85) 100%);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:999;animation:burnAnim 0.2s infinite alternate}
#burn-overlay h2{font-size:clamp(32px,8vw,64px);color:#fff700;text-shadow:0 0 20px #ff0000, 4px 4px 0 #000;margin:0;font-style:italic}
#burn-overlay .flame{font-size:80px;animation:bounce 0.2s infinite alternate}
@keyframes burnAnim{from{opacity:0.85}to{opacity:1}}
@keyframes bounce{from{transform:scale(0.9)}to{transform:scale(1.2)}}
</style></head><body>

 p.on('open',()=>{if(opened)return;opened=1;clearTimeout(tm);lobbyUI()});

  c.on('data',m=>{c.rx=Date.now();if(m.t=='ping')return;
   if(m.t=='hi'){if(conns.includes(c))return;if(lobby.length>=6||mode!='lobby'){c.close();return}c.slot=ns++;conns.push(c);lobby.push({slot:c.slot,ch:m.ch});sendOne(c,{t:'you',slot:c.slot});bc({t:'lobby',l:lobby});lobbyUI()}
   else{hd(m);fwd(c,m)}});
  c.on('close',()=>drop(c));c.on('error',()=>{})})}

  if(!ok){clearTimeout(tm);return fail(e.type=='peer-unavailable'?'Sala não encontrada. Confira o código e se o anfitrião já criou a sala.':'Não conectou: '+e.type)}

function step(k,dt,go){
 let bd=1e18,bi=k.idx;
 for(let o=-15;o<=35;o++){const i=(k.idx+o+N)%N,p=S[i],d=(p[0]-k.x)**2+(p[1]-k.y)**2;if(d<bd){bd=d;bi=i}}
 if(bi<k.idx-N/2)k.lap++;else if(bi>k.idx+N/2)k.lap--;
 k.idx=bi;const dist=Math.sqrt(bd);k.off=dist>T.w;k.boost-=dt;k.spin-=dt;k.slow-=dt;
 let th=0,st=0,use=0;if(go)[th,st,use]=ctl(k);
 if(k.spin>0){st=0;th=0;k.v*=.97}
 const max=(k.fin?180:245)*(k.bot?k.sk:1)*(k.off?.45:1)*(k.slow>0?.5:1)+(k.boost>0?150:0);
 if(th>0)k.v+=(k.v<max?320:0)*dt*th;else if(th<0)k.v-=480*dt;else k.v*=1-dt*.6;
 if(k.v>max)k.v-=400*dt;if(k.v<-80)k.v=-80;

 if(dist>T.w*1.7){const p=S[bi];k.x+=(p[0]-k.x)*.08;k.y+=(p[1]-k.y)*.08;k.v*=.97}
 if(!go)return;

 HZ.forEach(h=>{if((h.x-k.x)**2+(h.y-k.y)**2<700){k.spin=1.1;k.v*=.4;h.dead=1;send({t:'rm',id:h.id});if(k===me)bp(35,.3,'sawtooth')}});

 for(let i=0;i<K.length;i++)for(let j=i+1;j<K.length;j++){const a=K[i],b=K[j];if(a.left||b.left)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<34&&d>0){const o=(34-d)/2,nx=dx/d,ny=dy/d;if(a.mine){a.x-=nx*o;a.y-=ny*o;a.v*=.98}if(b.mine){b.x+=nx*o;b.y+=ny*o;b.v*=.98}}}
