<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Turbo Amigos Kart</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}
html,body,canvas,#tc,#tc button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
canvas,#tc button{touch-action:none}
html,body{margin:0;height:100%;background:#0b0d18;color:#fff;font-family:'Trebuchet MS',system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;transition:filter .2s ease}
canvas.blurred{filter:blur(8px) saturate(1.5) contrast(1.2)}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 50% 15%,#2b3585,#0b0d18 70%);padding:12px;overflow:auto;text-align:center}
h1{margin:0;font-size:clamp(28px,6vw,54px);color:#ffcb1f;text-shadow:3px 3px 0 #e8341c;font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 18px;background:#ffcb1f;color:#222;cursor:pointer;box-shadow:0 4px 0 #b88a00}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a00}
button.alt{background:#3b82f6;color:#fff;box-shadow:0 4px 0 #1d4ea8}
.card{width:86px;padding:6px;border-radius:12px;background:#ffffff14;border:3px solid transparent;cursor:pointer;font-size:12px}
.card img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff}
.card.on{border-color:#ffcb1f;background:#ffffff30}
.trk{width:130px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:3px solid transparent;cursor:pointer;text-align:center;padding:4px}
.trk.on{border-color:#fff;outline:3px solid #ffcb1f}
input{font:inherit;padding:10px;border-radius:10px;border:0;width:110px;text-align:center;text-transform:uppercase}
small{opacity:.8}
#res{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#000d;padding:16px 22px;border-radius:16px;display:none;min-width:250px}
#res h2{margin:0 0 8px}.rr{display:flex;align-items:center;gap:8px;padding:3px 0;text-align:left}.rr img{width:30px;height:30px;border-radius:50%;object-fit:cover}
#tc{position:fixed;bottom:12px;left:0;right:0;display:none;justify-content:space-between;padding:0 14px;pointer-events:none}
#tc div{display:flex;gap:10px}#tc button{pointer-events:auto;width:78px;height:78px;font-size:30px;border-radius:50%;padding:0;opacity:.8}
</style></head><body>
